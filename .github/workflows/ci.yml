name: Meno CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meno-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and package (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-mcp.lock.txt
      - name: Record environment and install locked test client
        run: |
          mkdir -p test-results
          xcodebuild -version | tee test-results/environment.log
          swift --version | tee -a test-results/environment.log
          python -m pip install --require-hashes -r scripts/requirements-mcp.lock.txt
      - name: Source checks and all Swift tests
        run: scripts/test.sh 2>&1 | tee test-results/unit-tests.log
      - name: Build and verify release App
        run: scripts/build.sh release 2>&1 | tee test-results/build.log
      - name: Real MCP, CLI, retry, lifecycle and SIGTERM integration
        run: python scripts/integration-test.py
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-${{ matrix.runner }}
          path: test-results/
          retention-days: 14
      - name: Upload verified local-development package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Meno-${{ matrix.runner }}-${{ github.sha }}
          path: |
            dist/Meno.zip
            dist/build-info.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
